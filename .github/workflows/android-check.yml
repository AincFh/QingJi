name: QingJi · Android unit tests and debug build
on:
  pull_request:
    branches: [main, codex/qingji-v6-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    name: Real Kotlin tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub ubuntu-latest already provides ANDROID_HOME and the SDK.
      # Do not invoke setup-android@v3: its install of the deleted "tools"
      # package fails on current cmdline-tools releases.
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify matching Android SDK and install missing components only
        run: |
          test -n "${ANDROID_HOME:-}" || { echo "ANDROID_HOME missing"; exit 1; }
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;36.0.0"
          fi
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
      - name: Use official Gradle distribution mirror in CI
        run: |
          sed -i 's#mirrors.cloud.tencent.com/gradle/#services.gradle.org/distributions/#' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
      - name: Run actual JVM tests, build Android APK and run lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
      - name: Attach APK and unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qingji-csv-export-debug-qa
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
